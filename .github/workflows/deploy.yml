name: Manual Build and Promote FastAPI App

on:
  workflow_dispatch:
    inputs:
      deploy_notes:
        description: 'Deployment / Release Notes'
        required: false
        default: 'Manual release'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tag
        id: meta
        run: echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to Dev
        run: |
          echo "Notes: ${{ inputs.deploy_notes }}"
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} to DEV"

  approve-qa:
    needs: [build-and-push, deploy-dev]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Wait for QA Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: <your-github-username>
          minimum-approvals: 1
          issue-title: "Approve QA Promotion: ${{ needs.build-and-push.outputs.image_tag }}"
          issue-body: "Review Dev deployment. Reply with your approval comment (e.g., 'approved - tested in dev') or 'deny' to abort."

  promote-qa:
    needs: [build-and-push, approve-qa]
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Promote and Deploy to QA
        run: |
          echo "Promoting ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} to QA"

  approve-prod:
    needs: [build-and-push, promote-qa]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Wait for Prod Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: <your-github-username>
          minimum-approvals: 1
          issue-title: "Approve PROD Promotion: ${{ needs.build-and-push.outputs.image_tag }}"
          issue-body: "Review QA deployment. Reply with your approval comment (e.g., 'approved - ready for prod') or 'deny' to abort."

  promote-prod:
    needs: [build-and-push, approve-prod]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Promote and Deploy to Prod
        run: |
          echo "Promoting ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} to PROD"
